[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "powerlog"
version = "0.1.2"
dependencies = []
requires-python = ">=3.8"
authors = [
  {name = "Ahmedur Rahman Shovon", email = "ashovon@anl.gov"},
]
description = "Measure the CPU and GPU energy consumed by an unmodified program"
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: GPU",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Benchmark",
    "Topic :: System :: Hardware",
    "Topic :: System :: Monitoring",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]
keywords = [
    "powerlog",
    "energy",
    "power",
    "profiling",
    "gpu",
    "cpu",
    "nvidia",
    "nvml",
    "amd",
    "rocm",
    "sycl",
    "rapl",
    "hpc",
    "benchmark",
]

[project.optional-dependencies]
docs = [
    "sphinx>=7.0,<10",
    "furo>=2024.1.29",
    "sphinx-copybutton>=0.5,<1",
    "sphinx-argparse>=0.4,<1",
    "myst-parser>=2.0,<6",
]

[project.scripts]
powerlog = "powerlog.cli:main"

[project.urls]
Homepage = "https://github.com/arsho/powerlog"
Documentation = "https://powerlog.readthedocs.io"
Repository = "https://github.com/arsho/powerlog"
Issues = "https://github.com/arsho/powerlog/issues"
Changelog = "https://github.com/arsho/powerlog/blob/main/Changelog.md"

[tool.hatch.build.targets.wheel]
packages = ["src/powerlog"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/docs",
    "/apps",
    "/README.md",
    "/Changelog.md",
    "/LICENSE",
]
